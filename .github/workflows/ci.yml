# Checks every push to master and every pull request, then deploys
# (decision 032):
#   - master: apply D1 migrations to production, deploy, smoke-test
#     https://bits.yogan.dev. GitHub Environment `production`.
#   - same-repo pull requests: a Workers Preview at
#     pr-<n>-bits.ryanyogan.workers.dev on the separate preview D1 and R2,
#     commented on the PR. GitHub Environment `preview`. Fork PRs and
#     Dependabot get the check only, never a secret.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR supersedes its last run. On master, never cancel: the
  # run may be mid-migration or mid-deploy. The next one waits instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bits/ui exec playwright install --with-deps --only-shell chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The deploy jobs ship exactly what was checked here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: apps/web/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bits.yogan.dev
    # One production deploy at a time, and never cancel one in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Until the owner adds the Cloudflare secrets, a push only runs the
      # checks; deploys stay manual (`pnpm deploy`). A notice, not a failure.
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy (decision 032)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.creds.outputs.ready == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      # For the lockfile's wrangler.
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.creds.outputs.ready == 'true'
        with:
          name: web-build
          path: apps/web/build
      # Before the code that needs them. Migrations must be additive
      # (expand, deploy, then contract), because the old code serves
      # traffic until the deploy below finishes.
      - name: Apply D1 migrations (production)
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "ci ${SHA}" --tag "${SHA:0:12}"
      # After the code that serves them (decision 036). Every folder in
      # content/courses/ is built against production's ready videos; only a
      # course whose build differs from its newest version gets a new one,
      # published at once. A course with errors is recorded as a failed
      # version after the others are handled, and fails the job.
      - name: Publish courses (production)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm content upload --all --publish --remote
      # Runs whenever the code was deployed, even if publishing failed: the
      # site must still answer.
      - name: Smoke test https://bits.yogan.dev
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && steps.deploy.outcome == 'success' }}
        run: |
          set -euo pipefail
          base=https://bits.yogan.dev
          for path in /health / /courses /login /robots.txt /sitemap.xml; do
            status=000
            for _ in 1 2 3 4 5; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || echo 000)
              [ "$status" = 200 ] && break
              sleep 6
            done
            echo "$path -> $status"
            if [ "$status" != 200 ]; then
              echo "::error::$base$path answered $status after the deploy. Roll back with: pnpm --filter @bits/web exec wrangler rollback (code only; migrations stay)."
              exit 1
            fi
          done

  preview:
    needs: check
    # Same-repo PRs only: fork and Dependabot runs get no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    # One deploy per PR at a time; don't cancel one mid-migration.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Previews stay off (a notice, not a failure) until the owner creates
      # the preview D1 and sets its id in wrangler.jsonc. A previews block
      # that names production fails here.
      - name: Check preview resources
        id: ready
        working-directory: apps/web
        run: |
          set +e
          node --import remix/node-tsx scripts/preview.ts check
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            echo "::notice::Workers Previews are not set up yet (decision 032); skipping the preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: web-build
          path: apps/web/build
      # The shared preview database only; scripts/preview.ts can't reach bits-db.
      - name: Apply D1 migrations (preview database)
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --import remix/node-tsx scripts/preview.ts migrate
      - name: Publish this branch's courses to the preview database
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm content upload --all --publish --preview
      - name: Create or update the Preview
        id: preview
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # A fresh session secret per deploy: preview sessions don't need to
          # outlive a push, and no long-lived secret is shared with previews.
          secrets="$RUNNER_TEMP/preview-secrets.env"
          umask 077
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > "$secrets"
          output="$(pnpm exec wrangler preview --name "pr-$PR" --ignore-base-config \
            --message "ci $SHA" --tag "${SHA:0:12}" --secrets-file "$secrets" --json)"
          rm -f "$secrets"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the Preview
        if: steps.ready.outputs.ready == 'true'
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          for path in /health / /courses /login /robots.txt /sitemap.xml; do
            status=000
            for _ in 1 2 3 4 5; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${URL%/}$path" || echo 000)
              [ "$status" = 200 ] && break
              sleep 6
            done
            echo "$path -> $status"
            [ "$status" = 200 ] || { echo "::error::${URL%/}$path answered $status"; exit 1; }
          done
      - name: Comment the Preview URL on the PR
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- bits-preview -->'
          # shellcheck disable=SC2016 # the backticks are Markdown
          body="$(printf '%s\n**Preview:** %s\n\nCommit `%s`. Runs on the shared preview database and bucket (`bits-preview-db`, `bits-preview-content`), never production data. No live model runs (decision 032).\n\n**Sign in:** mail is off on previews, so the sign-in code is shown on the page (decision 038). Use a made-up address such as `you+pr%s@example.com`: anyone can sign in as any address on a preview. GitHub and Google sign-in are hidden. New accounts are learners; to test author pages, see decision 038.\n' \
            "$marker" "$URL" "${SHA:0:12}" "$PR")"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
